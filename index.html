<!DOCTYPE html>
<html lang="en">

<!-- ============================================================
     Anime OLED — index.html
     AMOLED-optimized anime image finder and downloader.
     Powered by the waifu.im public API.
     Fonts: Outfit (Google Fonts) | Styles: styles/style.css
     Logic:  js/script.js
     ============================================================ -->

<!-- ─── HEAD: Meta, Styles & Fonts ─────────────────────────── -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime OLED</title>
    <link rel="icon" type="image/png" href="images/favicon.png">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="styles/style.css">

    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<!-- ─── BODY ─────────────────────────────────────────────────
     .amoled-theme applies the pure black (#000) background.
     ─────────────────────────────────────────────────────────── -->

<body class="amoled-theme">

    <!-- Drawer Backdrop -->
    <div id="drawer-backdrop" class="drawer-backdrop hidden"></div>
    <div class="container">

        <!-- ─── HEADER: Title & Tagline ─────────────────────── -->
        <header>
            <h1>Anime <span class="accent">OLED</span></h1>
            <p>Anime That Glows in the Dark</p>
        </header>

        <main>

            <!-- ─── SETTINGS DRAWER ───────────────────────────── -->
            <aside id="drawer" class="drawer glass">
                <h3 style="color: white; margin-bottom: 1rem;">Settings</h3>

                <!-- SFW / NSFW Toggle -->
                <div class="control-group">
                    <label for="type-toggle">Content Type</label>
                    <div class="toggle-container">
                        <span class="toggle-label sfw active">SFW</span>
                        <label class="switch">
                            <input type="checkbox" id="type-toggle">
                            <span class="slider round"></span>
                        </label>
                        <span class="toggle-label nsfw">NSFW</span>
                    </div>
                </div>
            </aside><!-- /.drawer -->

            <!-- ─── MAIN CONTROLS ───────────────────────────── -->
            <div class="controls glass">

                <!-- Search Mode Toggle -->
                <div class="control-group">
                    <label for="mode-toggle">Search Mode</label>
                    <div class="toggle-container">
                        <span class="toggle-label mode-cat active">Category</span>
                        <label class="switch">
                            <input type="checkbox" id="mode-toggle">
                            <span class="slider round"></span>
                        </label>
                        <span class="toggle-label mode-search">Custom</span>
                    </div>
                </div>

                <!-- Category Dropdown -->
                <div class="control-group" id="group-category">
                    <label>Category</label>
                    <div class="custom-dropdown" id="category-dropdown">
                        <button class="dropdown-trigger glass" id="dropdown-trigger" aria-haspopup="true"
                            aria-expanded="false">
                            <span id="selected-category">Waifu</span>
                            <!-- Chevron icon -->
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" aria-hidden="true">
                                <path d="m6 9 6 6 6-6" />
                            </svg>
                        </button>
                        <!-- Popover grid — populated dynamically by JS -->
                        <div class="dropdown-popover glass hidden" id="dropdown-popover">
                            <div class="popover-header">
                                <span>Choose a category</span>
                            </div>
                            <div class="category-grid" id="category-grid">
                                <!-- Injected by populateCategories() in script.js -->
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Custom Search Input -->
                <div class="control-group hidden" id="group-search">
                    <label for="custom-search">Custom Search</label>
                    <input type="text" id="custom-search" class="search-input glass" placeholder="e.g. naruto ">
                </div>

                <!-- Action Buttons -->
                <div class="button-group">
                    <button id="find-btn" class="primary-btn icon-btn" title="Find">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </button>
                    <button id="download-btn" class="secondary-btn icon-btn" disabled title="Download">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                    </button>
                    <button id="drawer-toggle" class="drawer-toggle glass icon-btn" aria-label="Settings"
                        title="Settings">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path
                                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                            </path>
                        </svg>
                    </button>
                </div>
            </div><!-- /.controls -->

            <!-- ─── IMAGE DISPLAY CARD ─────────────────────────
                 Floating panel that previews the fetched image.
                 Three possible states (managed by JS):
                   • #placeholder — initial empty state (SVG icon)
                   • #loader      — spinner while image is loading
                   • #anime-img   — loaded image
                 ─────────────────────────────────────────────── -->
            <div class="image-display glass">

                <!-- Loading spinner (hidden by default) -->
                <div id="loader" class="loader hidden"></div>

                <!-- Carousel Viewport: Contains the sliding image track and navigation arrows -->
                <div id="carousel-viewport" class="carousel-viewport hidden">
                    <div id="carousel-track" class="carousel-track">
                        <!-- Image slides will be injected here by script.js -->
                    </div>

                    <!-- Navigation Arrows -->
                    <button class="nav-arrow prev-arrow glass" id="prev-btn" aria-label="Previous image">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m15 18-6-6 6-6" />
                        </svg>
                    </button>
                    <button class="nav-arrow next-arrow glass" id="next-btn" aria-label="Next image">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m9 18 6-6-6-6" />
                        </svg>
                    </button>
                </div>

                <!-- Placeholder shown before any image is fetched -->
                <div id="placeholder" class="placeholder">
                    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect width="18" height="18" x="3" y="3" rx="2" ry="2" />
                        <circle cx="9" cy="9" r="2" />
                        <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" />
                    </svg>
                    <p>Search for an image collection to preview</p>
                </div>

            </div><!-- /.image-display -->

            <!-- ─── THUMBNAIL TRACK ───
                 Dynamic row that populates with many images at once.
                 The active thumbnail expands in width to highlight it.
                 ─────────────────────────────────────────────── -->
            <div id="thumbnail-area" class="thumbnail-area hidden">
                <div id="thumbnail-track" class="thumbnail-track scrollbar-hide">
                    <!-- Thumbnails will be injected here by script.js -->
                </div>
            </div>

        </main>

        <!-- ─── FOOTER: API Attribution ──────────────────────── -->
        <footer>
            <p>Powered by <a href="https://waifu.im" target="_blank" rel="noopener noreferrer">waifu.im</a>, <a
                    href="https://nekos.best" target="_blank" rel="noopener noreferrer">nekos.best</a> and <a
                    href="https://danbooru.donmai.us" target="_blank" rel="noopener noreferrer">Danbooru / Safebooru</a>
            </p>
        </footer>

    </div><!-- /.container -->

    <!-- ─── SCRIPTS ──────────────────────────────────────────── -->
    <script src="js/script.js"></script>

</body>

</html>
